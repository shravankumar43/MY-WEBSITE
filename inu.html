<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background-color: #eef2ff;
            font-family: Georgia, "Times New Roman", serif;
            color: #631756;
        }

        /* Header Section */
        header {
            background-color: #23b423;
            color: white;
            text-align: center;
            padding: 65px 20px;
            border-radius: 50px;
            margin-bottom: 5px;
        }

        header h1 {
            font-size: 64px;
            margin: 15px 0 20px;
        }

        header p {
            font-size: 30px;
            margin: 0;
        }

        /* Common Sections */
        section {
            background-color: white;
            padding: 30px 35px;
            border-radius: 22px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 42px;
            margin: 10px 0 25px;
        }

        /* Events Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 26px;
        }

        th {
            background-color: #3159ed;
            color: white;
            text-align: left;
            padding: 20px 18px;
        }

        td {
            padding: 22px 18px;
            border-bottom: 2px solid #d1d5e3;
        }

        /* Registration Form */
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        label {
            font-size: 27px;
            min-width: 98px;
        }

        input {
            width: 385px;
            max-width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #999;
            border-radius: 5px;
        }

        button {
            background-color: #3159ed;
            color: white;
            font-size: 25px;
            padding: 18px 35px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2344c5;
        }

        /* Mobile Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            header {
                padding: 35px 12px;
            }

            header h1 {
                font-size: 38px;
            }

            header p {
                font-size: 20px;
            }

            section {
                padding: 20px 15px;
            }

            h2 {
                font-size: 30px;
            }

            table {
                font-size: 15px;
            }

            th,
            td {
                padding: 13px 8px;
            }

            .form-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            label {
                font-size: 20px;
            }

            input {
                width: 100%;
                font-size: 16px;
            }

            button {
                font-size: 19px;
                padding: 14px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </header>

    <!-- Upcoming Events -->
    <section>
        <h2>Upcoming Events</h2>

        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>

                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- Registration Form -->
    <section>
        <h2>Register</h2>

        <form id="registerForm">
            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <p id="message" role="status"></p>
    </section>

    <script>
        document.getElementById("registerForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                const name = document.getElementById("name").value;

                document.getElementById("message").textContent =
                    "Thank you, " + name + "! Your form is ready.";
            });
    </script>

</body>

</html>
